name: Publicar no GitHub Pages

# Monta e publica o site estatico. Aqui NAO vai dado nenhum: o site sobe vazio e
# busca o snapshot no Firestore depois do login. Um site no GitHub Pages e
# publico mesmo em repositorio privado, entao nada de embutir a base no artefato.

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/metricas.js'
      - 'src/normalizar.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site
        run: |
          set -e
          mkdir -p site/compartilhado
          cp -r public/. site/
          # os dois modulos puros que o navegador tambem roda. O mesmo caminho
          # que o server.js serve em /compartilhado/, para o front nao precisar
          # saber em qual dos dois modos esta.
          cp src/metricas.js src/normalizar.js site/compartilhado/
          touch site/.nojekyll
          echo "Conteúdo publicado:"
          find site -type f | sort

      # PRE-REQUISITO, uma vez por repositorio:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      #
      # Com a origem em "Deploy from a branch" o site NAO quebra — ele fica pior
      # que isso: o Jekyll do proprio GitHub monta o README como se fosse o site
      # e publica DEPOIS deste workflow, marcando o nosso deploy como `inactive`.
      # Os dois pipelines escrevem no mesmo ambiente e o ultimo ganha. O
      # resultado e um workflow verde publicando um site que ninguem ve: quem
      # abre o link cai no README.
      #
      # Por isso a origem e conferida antes do deploy, e o job falha de proposito
      # quando ela esta errada — melhor um X vermelho com a instrucao do que um
      # sucesso mentiroso.
      - name: Conferir a origem do Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          origem() { gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || true; }
          atual=$(origem)

          # sem permissao para ler a configuracao: avisa e segue, porque falhar
          # aqui derrubaria uma publicacao que talvez esteja certa
          if [ -z "$atual" ]; then
            echo "::warning::Não deu para ler a origem do Pages (token sem permissão). Seguindo."
            exit 0
          fi
          if [ "$atual" = workflow ]; then
            echo "Origem do Pages: GitHub Actions — é o que este workflow precisa."
            exit 0
          fi

          # tentativa de conserto automatico. Costuma falhar: trocar a origem pede
          # `administration:write`, que o GITHUB_TOKEN não tem. Custa uma chamada
          # e evita a viagem ao painel quando o repositorio permite.
          echo "Origem do Pages: '$atual'. Tentando trocar para 'workflow'..."
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow >/dev/null 2>&1 || true
          if [ "$(origem)" = workflow ]; then
            echo "Trocada para GitHub Actions."
            exit 0
          fi

          # a anotacao vermelha do topo cabe numa linha so; o resto vai no log
          echo "::error::Pages está em '$atual' (Deploy from a branch): o link abre o README. Troque a origem para GitHub Actions em Settings -> Pages."
          cat >&2 <<FIM

          Com a origem em '$atual', o Jekyll do GitHub publica o README por cima
          deste workflow e o dashboard nunca aparece. Trocar é uma vez só:

            https://github.com/$GITHUB_REPOSITORY/settings/pages
            Build and deployment -> Source -> GitHub Actions

          Feito isso, rode este workflow de novo (Actions -> Publicar no GitHub
          Pages -> Run workflow) e o link passa a abrir o sistema.
          FIM
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
